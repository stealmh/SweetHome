name: iOS CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create Config Files
      run: |
        mkdir -p SweetHome/XCConfig
        mkdir -p SweetHome/Resources

        echo '${{ secrets.XCCONFIG_CONTENT }}' > SweetHome/XCConfig/xcconfig.xcconfig
        echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > SweetHome/Resources/GoogleService-Info.plist

        echo "Config files created successfully"

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Xcode 버전
      run: xcodebuild -version

    - name: 사용 가능한 시뮬레이터 목록
      run: xcrun xctrace list devices

    - name: 시뮬레이터 실행
      run: |
        xcrun simctl list devices available | grep "iPhone SE"

        SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone SE (3rd generation)" | head -1 | grep -oE '\([A-F0-9-]{36}\)' | tr -d '()')
        if [ ! -z "$SIMULATOR_ID" ]; then
          echo "Booting simulator: $SIMULATOR_ID"
          xcrun simctl boot $SIMULATOR_ID || true
          xcrun simctl bootstatus $SIMULATOR_ID -b
          echo "Simulator booted successfully"
        else
          echo "No iPhone SE simulator found, using default"
        fi
        sleep 5

    - name: 테스트 검증
      env:
        CI: true
      run: |
        echo "CI: $CI"
        xcodebuild clean test \
          -project SweetHome.xcodeproj \
          -scheme SweetHomeTests \
          -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.4' \

  build:
    name: Build App
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Build App
      run: |
        xcodebuild build \
          -project SweetHome.xcodeproj \
          -scheme SweetHome \
          -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.4' \
          -configuration Debug \

    - name: Archive Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: DerivedData/Build/Products/
        retention-days: 7

  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create Config Files
      run: |
        mkdir -p SweetHome/XCConfig
        mkdir -p SweetHome/Resources

        echo '${{ secrets.XCCONFIG_CONTENT }}' > SweetHome/XCConfig/xcconfig.xcconfig
        echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > SweetHome/Resources/GoogleService-Info.plist

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Import Code Signing Certificates
      env:
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        DISTRIBUTION_CERTIFICATE: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain

        echo "$DISTRIBUTION_CERTIFICATE" | base64 -d > certificate.p12
        security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

        rm certificate.p12

    - name: Download Provisioning Profile
      env:
        PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
      run: |
        echo "$PROVISIONING_PROFILE" | base64 -d > profile.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
        rm profile.mobileprovision

    - name: Archive App
      run: |
        xcodebuild archive \
          -project SweetHome.xcodeproj \
          -scheme SweetHome \
          -configuration Release \
          -archivePath SweetHome.xcarchive \
          -allowProvisioningUpdates

    - name: Export IPA
      run: |
        cat > ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath SweetHome.xcarchive \
          -exportPath . \
          -exportOptionsPlist ExportOptions.plist

    - name: Upload to TestFlight
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: |
        echo "$APP_STORE_CONNECT_API_KEY" > AuthKey.p8

        xcrun altool --upload-app \
          --type ios \
          --file SweetHome.ipa \
          --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
          --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
          --apiPrivateKeyFile AuthKey.p8

        rm AuthKey.p8

    - name: Clean up keychain
      if: always()
      run: |
        security delete-keychain build.keychain || true

