name: iOS CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Show Available Simulators
      run: xcrun xctrace list devices

    - name: Run Unit Tests
      timeout-minutes: 15
      run: |
        xcodebuild clean test \
          -project SweetHome.xcodeproj \
          -scheme SweetHomeTests \
          -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.4' \

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.json
        fail_ci_if_error: false
        verbose: true

  build:
    name: Build App
    runs-on: macos-latest
    needs: test

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Cache Dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ~/.cocoapods
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/Podfile.lock', '**/*.xcodeproj') }}
        restore-keys: |
          ${{ runner.os }}-xcode-

    - name: Install Dependencies (if using CocoaPods)
      run: |
        if [ -f Podfile ]; then
          gem install cocoapods
          pod install --repo-update
        fi

    - name: Build App for Testing
      timeout-minutes: 15
      run: |
        set -o pipefail
        xcodebuild \
          -project SweetHome.xcodeproj \
          -scheme SweetHomeTests \
          -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.4' \
          -configuration Debug \
          -derivedDataPath DerivedData \
          -quiet \
          build-for-testing | xcpretty

    - name: Build App for Release
      timeout-minutes: 15
      run: |
        set -o pipefail
        xcodebuild \
          -project SweetHome.xcodeproj \
          -scheme SweetHome \
          -configuration Release \
          -derivedDataPath DerivedData \
          -destination 'generic/platform=iOS' \
          -quiet \
          build | xcpretty

    - name: Archive Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: DerivedData/Build/Products/
        retention-days: 7

