name: iOS CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create Config Files
      run: |
        mkdir -p SweetHome/XCConfig
        mkdir -p SweetHome/Resources

        echo '${{ secrets.XCCONFIG_CONTENT }}' > SweetHome/XCConfig/xcconfig.xcconfig
        echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > SweetHome/Resources/GoogleService-Info.plist

        echo "Config files created successfully"

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Xcode 버전
      run: xcodebuild -version

    - name: 사용 가능한 시뮬레이터 목록
      run: xcrun xctrace list devices

    - name: 시뮬레이터 실행
      run: |
        xcrun simctl list devices available | grep "iPhone SE"

        SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone SE (3rd generation)" | head -1 | grep -oE '\([A-F0-9-]{36}\)' | tr -d '()')
        if [ ! -z "$SIMULATOR_ID" ]; then
          echo "Booting simulator: $SIMULATOR_ID"
          xcrun simctl boot $SIMULATOR_ID || true
          xcrun simctl bootstatus $SIMULATOR_ID -b
          echo "Simulator booted successfully"
        else
          echo "No iPhone SE simulator found, using default"
        fi
        sleep 5

    - name: 테스트 검증
      run: |
        xcodebuild clean test \
          -project SweetHome.xcodeproj \
          -scheme SweetHomeTests \
          -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.4' \

  build:
    name: Build App
    runs-on: macos-latest
    needs: test

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Build App
      run: |
        xcodebuild build \
          -project SweetHome.xcodeproj \
          -scheme SweetHome \
          -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.4' \
          -configuration Debug \

    - name: Archive Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: DerivedData/Build/Products/
        retention-days: 7

